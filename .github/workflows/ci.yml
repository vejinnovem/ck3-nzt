name: CI

on:
  push:
    branches: [main, nzt-alpha]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Validate PowerShell setup syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: "[scriptblock]::Create((Get-Content -Raw ./setup.ps1)) | Out-Null"
